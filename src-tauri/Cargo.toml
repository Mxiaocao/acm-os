[workspace]
members = [
  ".",
  "crates/acm-os-domain",
  "crates/acm-os-application",
  "crates/acm-os-infrastructure",
]
resolver = "2"

[package]
name = "acm-os"
version = "0.1.0"
description = "ACM-OS desktop application"
authors = ["ACM-OS contributors"]
edition = "2021"

[features]
desktop-e2e = []

[lib]
name = "acm_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
acm-os-application = { path = "crates/acm-os-application" }
acm-os-domain = { path = "crates/acm-os-domain" }
acm-os-infrastructure = { path = "crates/acm-os-infrastructure" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
notify = "8"
url = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
